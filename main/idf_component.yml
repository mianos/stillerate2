dependencies:
  # Shared infrastructure — mianesp repo, main branch.
  jsonwrapper:
    git: git@github.com:mianos/mianesp.git
    path: components/jsonwrapper
    version: main
  nvsstoragemanager:
    git: git@github.com:mianos/mianesp.git
    path: components/nvsstoragemanager
    version: main
  wifimanager:
    git: git@github.com:mianos/mianesp.git
    path: components/wifimanager
    version: main
  button:
    git: git@github.com:mianos/mianesp.git
    path: components/button
    version: main
  webserver:
    git: git@github.com:mianos/mianesp.git
    path: components/webserver
    version: main
  httpclient:
    git: git@github.com:mianos/mianesp.git
    path: components/httpclient
    version: main
  mqttwrapper:
    git: git@github.com:mianos/mianesp.git
    path: components/mqttwrapper
    version: main

  # Espressif registry components (cJSON is no longer bundled in IDF v6;
  # mqtt is now a managed component). network_provisioning is pulled
  # transitively by wifimanager.
  espressif/cjson: "*"
  espressif/mqtt: "*"
